services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vendeursenlive
      POSTGRES_USER: vendeursenlive
      POSTGRES_PASSWORD: vendeursenlive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendeursenlive -d vendeursenlive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./vendeursenlive-backend
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgres://vendeursenlive:vendeursenlive@postgres:5432/vendeursenlive
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_TOKEN_SECRET: local-dev-access-secret-change-me-32-chars
      JWT_REFRESH_TOKEN_SECRET: local-dev-refresh-secret-change-me-32-chars
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 2592000
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
      PASSWORD_RESET_TOKEN_TTL_SECONDS: 1800
      AUTH_EXPOSE_PASSWORD_RESET_TOKEN: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      CSRF_PROTECTION_ENABLED: "true"
      RUN_MIGRATIONS_ON_START: "true"
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-replace-with-local-tiktok-client-key}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-replace-with-local-tiktok-client-secret}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-http://localhost:8080/auth/tiktok/callback}
      TIKTOK_SCOPES: user.info.basic
      TIKTOK_AUTH_URL: https://www.tiktok.com/v2/auth/authorize/
      TIKTOK_TOKEN_URL: https://open.tiktokapis.com/v2/oauth/token/
      TIKTOK_USER_INFO_URL: https://open.tiktokapis.com/v2/user/info/
      TIKTOK_SUCCESS_REDIRECT_URL: http://localhost:5173/app
      RUST_LOG: vendeursenlive_backend=debug,actix_web=info,sea_orm=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./vel-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
